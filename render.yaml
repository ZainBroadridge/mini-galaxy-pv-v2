services:
  - type: web
    name: mini-galaxy-pv-v2-api
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run check:syntax && npm run check:imports
    preDeployCommand: npm run db:migrate
    startCommand: npm run start --workspace @pv/api
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: CHAIN_ID
        value: "80002"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: RPC_HTTP_URL
        sync: false
      - key: BLOCK_EXPLORER_URL
        value: https://amoy.polygonscan.com
      - key: CORS_ORIGINS
        sync: false
      - key: SESSION_TTL_HOURS
        value: "24"
      - key: AUTH_NONCE_TTL_MINUTES
        value: "10"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "240"
      - key: MAX_DEPLOYMENTS_PER_WALLET_PER_DAY
        value: "5"

  - type: worker
    name: mini-galaxy-pv-v2-indexer
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run check:syntax && npm run check:imports && npm run compile
    preDeployCommand: npm run db:migrate
    startCommand: npm run start --workspace @pv/indexer
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: CHAIN_ID
        value: "80002"
      - key: DATABASE_URL
        sync: false
      - key: RPC_HTTP_URL
        sync: false
      - key: RPC_ARCHIVE_URL
        sync: false
      - key: RELAYER_PRIVATE_KEY
        sync: false
      - key: BLOCK_EXPLORER_URL
        value: https://amoy.polygonscan.com
      - key: CONFIRMATION_BLOCKS
        value: "12"
      - key: REORG_OVERLAP_BLOCKS
        value: "16"
      - key: TRANSFER_LOG_CHUNK_SIZE
        value: "2500"
      - key: VOTE_LOG_CHUNK_SIZE
        value: "2500"
      - key: BALANCE_CALL_CONCURRENCY
        value: "16"
      - key: MAX_SNAPSHOT_CANDIDATES
        value: "100000"
      - key: TOKEN_SCAN_START_BLOCK
        value: "0"
      - key: WORKER_POLL_INTERVAL_MS
        value: "1500"
      - key: JOB_CONCURRENCY
        value: "3"
      - key: JOB_LOCK_MINUTES
        value: "10"
      - key: TRANSACTION_WAIT_TIMEOUT_MS
        value: "180000"
      - key: POLYGONSCAN_API_KEY
        sync: false
      - key: VERIFY_CONTRACTS
        value: "true"
